# 🖌 Styl logo
style.btn: "🖌 Styl logo"
style.btn_title: "Nadaj wspólny styl graficzny wybranym logo albo wszystkim z danego kraju (np. białe bez tła)"
style.title: "Styl logo"
style.help: "Styl tworzy nową wersję pliku (oryginały zostają nietknięte) i wybiera ją w 🎨 Wersje logo. Do auta trafi po zbudowaniu obrazu.\nKliknij kafelek, żeby pominąć plik. ⚠ = efekt pewnie nieudany (np. zostaje sama biała plama) — domyślnie pomijane, kliknięcie wymusza.\n🤖 AI: przycisk 🤖 na kafelku = tylko to logo; zakres „Zaznaczone wiersze” = przycisk AI bierze wszystkie zaznaczone; inny zakres = tylko ⚠."
style.help_basic: "Styl tworzy nową wersję pliku (oryginały zostają nietknięte). Od razu widać ją w podglądzie; do paczki USB trafi w kroku ④.\nKliknij kafelek, żeby pominąć plik. ⚠ = efekt pewnie nieudany (np. zostaje sama biała plama) — domyślnie pomijane, kliknięcie wymusza.\n🤖 AI: przycisk 🤖 na kafelku = tylko to logo; zakres „Zaznaczone wiersze” = przycisk AI bierze wszystkie zaznaczone; inny zakres = tylko ⚠."
